<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SummarizeAI — Instant AI Summaries</title>
  <meta name="description" content="Instantly summarize any text or PDF document using Google Gemini AI. Fast, free, and intelligent." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Background Orbs (Decorative) ───────────────────────────── -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="logo-text">SummarizeAI</span>
    </div>
    <div class="header-badge">Powered by Gemini 1.5 Flash</div>
  </header>

  <!-- ── Main Content ───────────────────────────────────────────── -->
  <main class="main">

    <!-- Hero Section -->
    <section class="hero">
      <h1 class="hero-title">
        Summarize anything,
        <span class="gradient-text">instantly.</span>
      </h1>
      <p class="hero-subtitle">
        Paste your text or drop a PDF — our AI reads it so you don't have to.
      </p>
    </section>

    <!-- ── Input Card ─────────────────────────────────────────── -->
    <div class="card input-card">

      <!-- Tab Switcher -->
      <div class="tab-switcher" role="tablist">
        <button
          id="tab-text"
          class="tab-btn active"
          role="tab"
          aria-selected="true"
          aria-controls="panel-text"
          onclick="switchTab('text')"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          Paste Text
        </button>
        <button
          id="tab-pdf"
          class="tab-btn"
          role="tab"
          aria-selected="false"
          aria-controls="panel-pdf"
          onclick="switchTab('pdf')"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <path d="M9 15h6M9 11h6"/>
          </svg>
          Upload PDF
        </button>
      </div>

      <!-- Text Panel -->
      <div id="panel-text" class="tab-panel active" role="tabpanel" aria-labelledby="tab-text">
        <div class="textarea-wrapper">
          <textarea
            id="text-input"
            placeholder="Paste your article, essay, report, or any text here…"
            maxlength="50000"
            spellcheck="false"
          ></textarea>
          <div class="char-counter">
            <span id="char-count">0</span> / 50,000 characters
          </div>
        </div>
      </div>

      <!-- PDF Panel -->
      <div id="panel-pdf" class="tab-panel" role="tabpanel" aria-labelledby="tab-pdf">
        <div
          id="drop-zone"
          class="drop-zone"
          onclick="document.getElementById('pdf-file-input').click()"
          ondragover="handleDragOver(event)"
          ondragleave="handleDragLeave(event)"
          ondrop="handleDrop(event)"
          role="button"
          tabindex="0"
          aria-label="Click or drag to upload a PDF file"
        >
          <div class="drop-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="drop-title">Drop your PDF here</p>
          <p class="drop-subtitle">or click to browse files</p>
          <input
            type="file"
            id="pdf-file-input"
            accept=".pdf"
            style="display:none"
            onchange="handleFileSelect(event)"
          />
        </div>
        <div id="file-selected" class="file-selected hidden">
          <div class="file-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
          </div>
          <div class="file-info">
            <span id="file-name" class="file-name"></span>
            <span id="file-size" class="file-size"></span>
          </div>
          <button class="file-remove-btn" onclick="removeFile()" aria-label="Remove file">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Options Row -->
      <div class="options-row">
        <div class="option-group">
          <label class="option-label" for="length-select">Summary Length</label>
          <div class="length-selector">
            <button id="len-short"   class="len-btn"        onclick="setLength('short')"   >Short</button>
            <button id="len-medium"  class="len-btn active"  onclick="setLength('medium')"  >Medium</button>
            <button id="len-detailed" class="len-btn"       onclick="setLength('detailed')" >Detailed</button>
          </div>
        </div>

        <button id="summarize-btn" class="summarize-btn" onclick="handleSummarize()">
          <span class="btn-text">Summarize</span>
          <div class="btn-spinner hidden" aria-hidden="true"></div>
          <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>

      <!-- Error Message -->
      <div id="error-msg" class="error-msg hidden" role="alert"></div>
    </div>

    <!-- ── Output Card ────────────────────────────────────────── -->
    <div id="output-card" class="card output-card hidden">
      <div class="output-header">
        <div class="output-title">
          <div class="ai-indicator">
            <span class="ai-dot"></span>
            AI Summary
          </div>
          <div id="output-meta" class="output-meta"></div>
        </div>
        <button id="copy-btn" class="copy-btn" onclick="copySummary()" aria-label="Copy summary to clipboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="copy-text">Copy</span>
        </button>
      </div>
      <div id="summary-output" class="summary-output"></div>
    </div>

  </main>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <footer class="footer">
    <p>Built with FastAPI + Google Gemini AI · <a href="/docs" target="_blank" rel="noopener">View API Docs →</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
